<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' blob: data:; object-src 'none'; base-uri 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visor</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ececee">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="lib/pdfjs/web/pdf_viewer.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Íconos de línea -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></symbol>
      <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></symbol>
      <symbol id="i-text-smaller" viewBox="0 0 24 24"><path d="M3 19 8.5 5h1L15 19M5.2 14h7.6M17 9h5"/></symbol>
      <symbol id="i-text-larger" viewBox="0 0 24 24"><path d="M3 19 8.5 5h1L15 19M5.2 14h7.6M17 9h5M19.5 6.5v5"/></symbol>
      <symbol id="i-pages" viewBox="0 0 24 24"><path d="M2 5h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2zM22 5h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7z"/></symbol>
      <symbol id="i-scroll" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M12 7v9M9 13l3 3 3-3"/></symbol>
    </defs>
  </svg>

  <nav id="tabs">
    <button id="tab-home" class="tab home" title="Inicio"><svg class="ic"><use href="#i-home"/></svg></button>
    <div id="tab-list"></div>
    <button id="tab-add" class="btn" title="Abrir archivo en pestaña nueva"><svg class="ic"><use href="#i-plus"/></svg></button>
  </nav>

  <header id="bar">
    <button id="btn-toc" class="btn" title="Índice" hidden><svg class="ic"><use href="#i-menu"/></svg></button>

    <div id="tools-pdf" class="tools" hidden>
      <div class="group">
        <button id="pdf-prev" class="btn" title="Página anterior"><svg class="ic"><use href="#i-up"/></svg></button>
        <input id="pdf-page" type="number" min="1" value="1" title="Página">
        <span id="pdf-total">/ 0</span>
        <button id="pdf-next" class="btn" title="Página siguiente"><svg class="ic"><use href="#i-down"/></svg></button>
      </div>
      <div class="group">
        <button id="pdf-zoom-out" class="btn" title="Alejar"><svg class="ic"><use href="#i-minus"/></svg></button>
        <select id="pdf-zoom" title="Zoom">
          <option value="page-width">Ancho</option>
          <option value="page-fit">Página</option>
          <option value="auto">Auto</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1">100%</option>
          <option value="1.25">125%</option>
          <option value="1.5">150%</option>
          <option value="2">200%</option>
          <option value="3">300%</option>
          <option value="custom" hidden></option>
        </select>
        <button id="pdf-zoom-in" class="btn" title="Acercar"><svg class="ic"><use href="#i-plus"/></svg></button>
      </div>
      <label class="search" title="Enter: siguiente · Shift+Enter: anterior">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="pdf-find" type="search" placeholder="Buscar">
        <span id="pdf-find-count"></span>
      </label>
    </div>

    <div id="tools-book" class="tools" hidden>
      <div class="group">
        <button id="book-font-down" class="btn" title="Letra más chica"><svg class="ic"><use href="#i-text-smaller"/></svg></button>
        <button id="book-font-up" class="btn" title="Letra más grande"><svg class="ic"><use href="#i-text-larger"/></svg></button>
      </div>
      <button id="book-flow" class="btn" title="Cambiar entre páginas y desplazamiento"><svg class="ic"><use href="#i-pages"/></svg></button>
    </div>

    <span class="spacer"></span>

    <label class="theme" title="Tono de fondo">
      <svg class="ic"><use href="#i-drop"/></svg>
      <select id="theme-select"></select>
    </label>
    <button id="btn-open" class="btn primary" title="Abrir archivo (Ctrl+O)"><svg class="ic"><use href="#i-folder"/></svg><span>Abrir</span></button>
  </header>

  <main>
    <aside id="sidebar" hidden>
      <div id="toc-list"></div>
    </aside>
    <section id="home">
      <div id="drop">
        <p class="big">Arrastrá un archivo acá o tocá <strong>Abrir</strong></p>
        <p class="formats">PDF · EPUB · MOBI · AZW3 · FB2 · CBZ</p>
      </div>
      <h2 id="recent-title" hidden>Recientes</h2>
      <ul id="recent"></ul>
    </section>

    <div id="msg" hidden></div>
    <div id="update-bar" role="status" hidden>
      <span>Hay una versión nueva del Visor.</span>
      <button id="update-btn" class="btn primary">Actualizar</button>
      <button id="update-later" class="btn" title="Más tarde"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
  </main>

  <template id="tpl-pdf">
    <section class="doc pdf"><div class="pdf-container"><div class="pdfViewer"></div></div></section>
  </template>
  <template id="tpl-book">
    <section class="doc book">
      <div class="book-host"></div>
      <footer class="book-nav">
        <button class="btn prev" title="Anterior"><svg class="ic"><use href="#i-left"/></svg></button>
        <input class="progress" type="range" min="0" max="1" step="any" value="0">
        <span class="pct">0%</span>
        <button class="btn next" title="Siguiente"><svg class="ic"><use href="#i-right"/></svg></button>
      </footer>
    </section>
  </template>

  <input id="file-input" type="file" multiple hidden
    accept=".pdf,.epub,.mobi,.azw,.azw3,.fb2,.fbz,.cbz,application/pdf,application/epub+zip">
  <script type="module" src="app.js"></script>
</body>
</html>
